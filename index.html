<title>Su turno · División de Experticias a Vehículos Automotores</title>
<!--
  Ticket digital del Sistema de Turnos · PNC · División de Experticias a Vehículos Automotores
  Esta página NO se conecta a ningún servidor ni guarda datos. El número de turno viaja
  en el enlace del QR después de «#» (esa parte nunca se envía por internet) y aquí solo
  se dibuja el ticket para guardarlo como imagen o PDF.
-->
<style>
:root{color-scheme:dark;--bg:#303845;--card:#363D4D;--deep:#29303C;--mut:#B5B8BC;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.top img.p{height:44px}.top img.s{height:42px}.top i{width:1px;align-self:stretch;background:rgba(255,255,255,.6)}
.top span{font:600 12px/1.25 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.card{position:relative;isolation:isolate;overflow:hidden;width:min(440px,100%);background:radial-gradient(120% 75% at 50% 0%,#414A5E 0%,#363D4D 55%,#2E3544 100%);border-radius:24px;padding:24px 22px 22px;text-align:center;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 50px -20px rgba(8,12,20,.7)}
.card::before{content:"";position:absolute;z-index:-1;left:50%;top:44%;width:94%;aspect-ratio:1;transform:translate(-50%,-50%);
  background:var(--wm) center/contain no-repeat;opacity:.13;pointer-events:none;
  -webkit-mask-image:radial-gradient(closest-side,#000 55%,transparent 100%);mask-image:radial-gradient(closest-side,#000 55%,transparent 100%)}
.lbl{font:600 13px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.num{font:700 clamp(84px,30vw,120px)/1 var(--ui);letter-spacing:-.02em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.svc{font:600 19px var(--ui)}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font:500 13px var(--ui);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#E3E3E3}
.chip.cita{background:rgba(47,107,209,.25);color:#CFE0FF}
.info{margin-top:20px;border-radius:18px;padding:16px;background:var(--deep);text-align:left;font-size:15px;line-height:1.5;color:#D3D6DB}
.info b{color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button{font:600 15px var(--ui);min-height:48px;border-radius:14px;border:none;cursor:pointer;color:#fff;background:rgba(255,255,255,.09)}
button.pri{background:#fff;color:#303845}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ver{margin-top:14px;font:500 12px var(--ui);color:#9EA5AF;letter-spacing:.04em}
.foot{width:min(440px,100%);margin-top:16px;font-size:13px;line-height:1.5;color:var(--mut);text-align:center}
.bad .num{font-size:38px;margin:14px 0}
/* Movimiento (DESIGN.md · Design Motion Principles): una sola entrada para el ticket y respuesta al tocar */
button{transition:transform .12s cubic-bezier(.23,1,.32,1),background-color .18s cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #8FB4E3;outline-offset:3px}
.card{animation:tkIn .32s cubic-bezier(.23,1,.32,1) both}
@keyframes tkIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}button{transition:none}button:active{transform:none}}
</style>
</head>
