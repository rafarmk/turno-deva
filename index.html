<title>Su turno · División de Experticias a Vehículos Automotores</title>
<!--
  Ticket digital del Sistema de Turnos · PNC · División de Experticias a Vehículos Automotores
  Esta página NO se conecta a ningún servidor ni guarda datos. El número de turno viaja
  en el enlace del QR después de «#» (esa parte nunca se envía por internet) y aquí solo
  se dibuja el ticket para guardarlo como imagen o PDF.
-->
<style>
:root{color-scheme:dark;--bg:#303845;--card:#363D4D;--deep:#29303C;--mut:#B5B8BC;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.top img.p{height:44px}.top img.s{height:42px}.top i{width:1px;align-self:stretch;background:rgba(255,255,255,.6)}
.top span{font:600 12px/1.25 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.card{width:min(440px,100%);background:var(--card);border-radius:24px;padding:24px 22px 22px;text-align:center;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 50px -20px rgba(8,12,20,.7)}
.lbl{font:600 13px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.num{font:700 clamp(84px,30vw,120px)/1 var(--ui);letter-spacing:-.02em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.svc{font:600 19px var(--ui)}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{font:500 13px var(--ui);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#E3E3E3}
.chip.cita{background:rgba(47,107,209,.25);color:#CFE0FF}
.info{margin-top:20px;border-radius:18px;padding:16px;background:var(--deep);text-align:left;font-size:15px;line-height:1.5;color:#D3D6DB}
.info b{color:#fff}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button{font:600 15px var(--ui);min-height:48px;border-radius:14px;border:none;cursor:pointer;color:#fff;background:rgba(255,255,255,.09)}
button.pri{background:#fff;color:#303845}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ver{margin-top:14px;font:500 12px var(--ui);color:#9EA5AF;letter-spacing:.04em}
.foot{width:min(440px,100%);margin-top:16px;font-size:13px;line-height:1.5;color:var(--mut);text-align:center}
.bad .num{font-size:38px;margin:14px 0}
/* Movimiento (DESIGN.md · Design Motion Principles): una sola entrada para el ticket y respuesta al tocar */
button{transition:transform .12s cubic-bezier(.23,1,.32,1),background-color .18s cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid #8FB4E3;outline-offset:3px}
.card{animation:tkIn .32s cubic-bezier(.23,1,.32,1) both}
@keyframes tkIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}button{transition:none}button:active{transform:none}}
</style>
</head>

<main class="card" id="card" aria-live="polite"></main>
<p class="foot" id="foot"></p>
<script>
(function () {
  'use strict';
  var SVC = { C: 'Experticia vehicular', P: 'Punto de Atención', V: 'Vehículo' };
  var $ = function (i) { return document.getElementById(i); };
  var m = decodeURIComponent(location.hash.slice(1)).toUpperCase().match(/^([CPV])(\d{3,4})\.([01])\.(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\.([A-Z0-9]{4})$/);
  if (!m) {
    $('card').className = 'card bad';
    $('card').innerHTML = '<p class="lbl">Ticket</p><p class="num">No válido</p><p class="info">Escanee de nuevo el código QR que le muestra Recepción.</p>';
    return;
  }
  var D = { num: m[1] + m[2], svc: SVC[m[1]], cita: m[3] === '1', fecha: m[6] + '/' + m[5] + '/20' + m[4], hora: m[7] + ':' + m[8], ver: m[9] };
  var dt = new Date(2000 + +m[4], +m[5] - 1, +m[6]);
  var old = (Date.now() - dt.getTime()) > 36 * 3600 * 1000;
  document.title = 'Turno ' + D.num + ' · DEVA PNC';
  $('card').innerHTML = '<p class="lbl">Su turno</p><p class="num"></p><p class="svc"></p><div class="meta">' + (D.cita ? '<span class="chip cita">Con cita</span>' : '') + '<span class="chip" id="fh"></span></div>' +
    '<div class="info">' + (old ? '<b>Este ticket es de otro día.</b> Solo vale la fecha en que se emitió.' : '<b>Esté atento a la pantalla de la sala:</b> le llamarán por su número y le indicarán la pista.') + '</div>' +
    '<div class="acts"><button type="button" class="pri" id="png">Guardar imagen</button><button type="button" id="pdf">Guardar PDF</button></div>' +
    '<p class="ver">Código de verificación: <span id="vc"></span></p>';
  $('card').querySelector('.num').textContent = D.num;
  $('card').querySelector('.svc').textContent = D.svc;
  $('fh').textContent = D.fecha + ' · ' + D.hora;
  $('vc').textContent = D.ver;
  $('foot').textContent = 'Ticket válido solo el día de hoy. Guárdelo o mantenga esta página abierta.';

  function round(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function draw() {
    var W = 900, H = 1300, c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d'), F = '-apple-system,Segoe UI,Roboto,Inter,sans-serif', L0 = $('lp'), L1 = $('ls');
    g.fillStyle = '#303845'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#363D4D'; round(g, 50, 250, W - 100, 900, 48); g.fill();
    g.drawImage(L0, W / 2 - 250, 70, 220, 220 * L0.naturalHeight / L0.naturalWidth);
    g.drawImage(L1, W / 2 + 60, 62, 110 * L1.naturalWidth / L1.naturalHeight, 110);
    g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(W / 2 + 20, 70, 2, 100);
    g.textAlign = 'center'; g.fillStyle = '#B5B8BC'; g.font = '600 34px ' + F; g.fillText('SU TURNO', W / 2, 340);
    g.fillStyle = '#FFFFFF'; g.font = '700 260px ' + F; g.fillText(D.num, W / 2, 600);
    g.font = '600 46px ' + F; g.fillText(D.svc, W / 2, 690);
    g.fillStyle = '#B5B8BC'; g.font = '500 36px ' + F; g.fillText((D.cita ? 'Con cita · ' : '') + D.fecha + ' · ' + D.hora, W / 2, 760);
    g.fillStyle = '#29303C'; round(g, 110, 830, W - 220, 230, 28); g.fill();
    g.fillStyle = '#FFFFFF'; g.font = '600 34px ' + F; g.fillText('Esté atento a la pantalla de la sala.', W / 2, 920);
    g.fillStyle = '#B5B8BC'; g.font = '400 30px ' + F; g.fillText('Le llamarán por su número.', W / 2, 970); g.fillText('Ticket válido solo el día ' + D.fecha + '.', W / 2, 1015);
    g.fillStyle = '#9EA5AF'; g.font = '500 26px ' + F; g.fillText('Código de verificación: ' + D.ver, W / 2, 1110);
    g.fillStyle = '#B5B8BC'; g.font = '600 28px ' + F; g.fillText('DIVISIÓN DE EXPERTICIAS A VEHÍCULOS AUTOMOTORES · PNC', W / 2, 1230);
    return c;
  }
  function save(blob, name) {
    var f = null; try { f = new File([blob], name, { type: blob.type }); } catch (e) {}
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: 'Turno ' + D.num }).catch(function () {}); return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  $('png').onclick = function () { draw().toBlob(function (b) { save(b, 'turno-' + D.num + '.png'); }, 'image/png'); };
  $('pdf').onclick = function () {
    var c = draw(), jpg = atob(c.toDataURL('image/jpeg', .92).split(',')[1]);
    var pw = 226.8, ph = pw * c.height / c.width, parts = [], len = 0, offs = [];
    function add(s) { parts.push(s); len += s.length; }
    var cont = 'q ' + pw.toFixed(2) + ' 0 0 ' + ph.toFixed(2) + ' 0 0 cm /Im0 Do Q';
    add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    offs[1] = len; add('1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n');
    offs[2] = len; add('2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n');
    offs[3] = len; add('3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ' + pw.toFixed(2) + ' ' + ph.toFixed(2) + ']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>endobj\n');
    offs[4] = len; add('4 0 obj<</Type/XObject/Subtype/Image/Width ' + c.width + '/Height ' + c.height + '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + jpg.length + '>>stream\n'); add(jpg); add('\nendstream endobj\n');
    offs[5] = len; add('5 0 obj<</Length ' + cont.length + '>>stream\n' + cont + '\nendstream endobj\n');
    var x = len, xr = 'xref\n0 6\n0000000000 65535 f \n';
    for (var i = 1; i <= 5; i++) xr += ('0000000000' + offs[i]).slice(-10) + ' 00000 n \n';
    add(xr + 'trailer<</Size 6/Root 1 0 R>>\nstartxref\n' + x + '\n%%EOF');
    var s = parts.join(''), u = new Uint8Array(s.length);
    for (var j = 0; j < s.length; j++) u[j] = s.charCodeAt(j) & 255;
    save(new Blob([u], { type: 'application/pdf' }), 'turno-' + D.num + '.pdf');
  };
})();
</script>
